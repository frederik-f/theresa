[project]
name = "theresa"
version = "1.0.0"
description = "THERESA -- THErmal REpository Surrogate Analysis: canister surface temperature in drift emplacement from an OpenGeoSys 6 model and its surrogate"
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-3.0-or-later AND CC-BY-4.0"
license-files = ["LICENSES/*.txt"]
authors = [
    { name = "frederik-f" },
]
keywords = [
    "repository",
    "nuclear-waste",
    "heat-conduction",
    "surrogate-model",
    "opengeosys",
    "gmsh",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    # Not for publication on PyPI.
    "Private :: Do Not Upload",
]

dependencies = [
    "numpy>=2.1",
    "scipy>=1.14.1",
    "matplotlib>=3.9.2",
    # data/surrogate.pkl is pickled with scikit-learn 1.9.
    "scikit-learn>=1.9.1,<1.10",
    "gmsh>=4.13",
    "ogstools>=0.8.2",
    "ogs>=6.5.8",
]

[project.urls]
Repository = "https://github.com/frederik-f/theresa"
Demo = "https://theresa.streamlit.app/"
Changelog = "https://github.com/frederik-f/theresa/blob/main/CHANGELOG.md"

[project.optional-dependencies]
test = [
    "pytest>=7.4",
]
gui = [
    "streamlit>=1.52",
]
docs = [
    "sphinx>=7.0",
    "myst-parser>=3.0",
]
dev = [
    "ruff>=0.16",
    "pre-commit>=3.7",
]

[project.scripts]
theresa = "theresa.cli:main"
theresa-gui = "theresa_gui.launch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["theresa", "theresa_gui"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error", "default::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "C4",   # comprehensions
    "SIM",  # simplifications
    "RET",  # return-statement hygiene
    "PTH",  # prefer pathlib
    "D",    # docstrings
    "ARG001",  # unused function argument
]
ignore = [
    "D203",  # incompatible with D211 (no blank line before a class docstring)
    "D212",  # summary position not enforced
    "D401",  # no imperative mood required
]

[tool.ruff.lint.pydocstyle]
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "ARG001", "ARG005", "B905"]
"scripts/*" = ["D103"]

[tool.ruff.format]
quote-style = "double"
